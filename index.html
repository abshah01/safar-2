<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #map { flex-grow: 1; width: 100%; height: 300px; }
        .panel { padding: 20px; text-align: center; background: white; border-top: 3px solid #008080; }
        .btn-group { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        button { padding: 12px 24px; background: #008080; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="login-panel" class="panel">
        <h3>🕋 Safar Tracker</h3>
        <p>Select identity to start tracking</p>
        <div class="btn-group">
            <button onclick="bootApp('Abba')">Abba</button>
            <button onclick="bootApp('Amma')">Amma</button>
            <button onclick="bootApp('Me')">Me</button>
        </div>
    </div>

    <div id="dash-panel" class="panel hidden">
        <div id="status">Tracking Active...</div>
        <div id="family-list" style="margin-top:10px; color: #008080;"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- CONFIG ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let map, markers = {};

        // --- BUTTON LOGIC ---
        window.bootApp = function(userName) {
            console.log("Button clicked for: " + userName);
            document.getElementById('login-panel').classList.add('hidden');
            document.getElementById('dash-panel').classList.remove('hidden');

            // Setup Map
            map = L.map('map').setView([23.8103, 90.4125], 13); // Default to Dhaka
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // START SENDER
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((pos) => {
                    const { latitude, longitude } = pos.coords;
                    db.ref('locations/' + userName).set({
                        lat: latitude,
                        lng: longitude,
                        time: new Date().toLocaleTimeString()
                    });
                    map.setView([latitude, longitude], 15);
                }, (err) => console.error("GPS Error", err), { enableHighAccuracy: true });
            }

            // START RECEIVER
            db.ref('locations/').on('value', (snap) => {
                const data = snap.val();
                let listHTML = "";
                for (let id in data) {
                    if (markers[id]) map.removeLayer(markers[id]);
                    markers[id] = L.marker([data[id].lat, data[id].lng]).addTo(map).bindPopup(id);
                    
                    if(id !== userName) {
                       listHTML += `<div>${id} is online</div>`;
                    }
                }
                document.getElementById('family-list').innerHTML = listHTML;
            });
        };
    </script>
</body>
</html>
